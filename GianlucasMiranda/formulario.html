<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulario</h1>
    </header>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="mi_historia.html">Mi historia</a>
        <a href="formulario.html">Formulario</a>
        <a href="mis_suenos.html">Mis sueños</a>
    </nav>
    <main>
        <section>
            <h2>¡Contactame!</h2>
            <form>
                <article>
                    <label>Nombre completo</label>
                    <input class="enviar" type="text" placeholder="Pon tu nombre completo">
                </article>
                <article>
                    <label>Correo electronico</label>
                    <input class="enviar" type="email" placeholder="juanito@papapa.com">
                </article>
                <article>
                    <label>Motivos</label>
                    <select class="enviar">
                        <option>Dudas</option>
                        <option>Sugerencias</option>
                        <option>Otros</option>
                    </select>
                </article>
                <article id="articulom">
                    <label>Mensaje</label>
                    <textarea id="mensaje" type="text" placeholder="Escriba su mensaje aqui"></textarea>
                </article>
                <article>
                    <button class="enviar" type="submit">Enviar</button>
                </article>
                <article>
                    <img src="form.png" alt="icono">
                </article>
            </form>
        </section>
    </main>
    <footer>
        <p>Creado por: Gianlucas Miranda</p>
    </footer>
</body>
</html>
